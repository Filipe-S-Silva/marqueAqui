# Deploy do APP na Netlify (monorepo): Base directory = raiz do repositório, Package directory = app/frontend.
# Os caminhos abaixo são relativos à raiz; o comando compila só este workspace.

[build]
  command = "npm run build -w @marqueaqui/app-frontend"
  publish = "app/frontend/dist"

# A API passa pelo proxy /api abaixo. Definido aqui porque o netlify.toml tem prioridade sobre o painel,
# e uma VITE_API_URL antiga no painel apontando direto para a Vercel quebra a sessão.
[build.environment]
  VITE_API_URL = "/api"

# A API é chamada em /api (proxy abaixo), então connect-src 'self' basta.
# style-src tem 'unsafe-inline' só para estilos: o Radix (react-remove-scroll, usado nos diálogos) injeta uma tag <style>.
# Scripts continuam restritos a 'self' (sem inline, sem eval). Se testar e os diálogos funcionarem sem isso, remova.
# Em desenvolvimento (npm run dev) estes cabeçalhos NÃO se aplicam; só valem no deploy.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Arquivos com hash no nome podem ficar em cache por um ano; o HTML nunca.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Service worker e manifesto do PWA: sempre revalidados, para uma versão nova chegar logo a quem instalou
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# API pelo mesmo domínio do site: o cookie de sessão (SameSite=Strict) só funciona assim,
# porque o navegador não o envia de netlify.app para vercel.app. Precisa vir antes da regra da SPA.
[[redirects]]
  from = "/api/*"
  to = "https://backend-eight-tawny-58.vercel.app/:splat"
  status = 200
  force = true

# SPA: qualquer rota cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
